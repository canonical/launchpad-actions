name: Charm

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to checkout
        type: string
        required: false
      charm_path:
        description: Path to the charm directory
        type: string
        default: charm
      charmcraft_channel:
        description: Charmcraft snap channel to install
        type: string
        default: 3.x/stable
      runner_arch:
        description: Runner architecture (amd64, arm64, ppc64el, s390x)
        type: string
        default: amd64
      runner_base:
        description: Runner base image (focal, jammy, noble)
        type: string
        default: noble
      runner_flavor:
        description: Runner flavor (small, medium, large, large-extra, xlarge, xlarge-extra)
        type: string
        default: large
    outputs:
      cache_hit:
        description: Whether the charm cache was hit
        value: ${{ jobs.handle-charm.outputs.cache_hit }}

permissions:
  contents: read

jobs:
  handle-charm:
    outputs:
      cache_hit: ${{ steps.charm-cache.outputs.cache-hit }}
    runs-on: self-hosted-linux-${{ inputs.runner_arch }}-${{ inputs.runner_base }}-${{ inputs.runner_flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Cache charm
        id: charm-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ inputs.charm_path }}/*.charm
          key: charm-${{ hashFiles(format('{0}/**', inputs.charm_path)) }}

      - name: Setup LXD
        if: steps.charm-cache.outputs.cache-hit != 'true'
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # v1.0.0

      - name: Install charmcraft
        if: steps.charm-cache.outputs.cache-hit != 'true'
        env:
          CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft_channel }}
        run: sudo snap install --classic charmcraft --channel="$CHARMCRAFT_CHANNEL"

      - name: Pack charm
        if: steps.charm-cache.outputs.cache-hit != 'true'
        env:
          CHARM_PATH: ${{ inputs.charm_path }}
        run: |
          cd "$CHARM_PATH"
          charmcraft pack -v

      - name: Upload charm artifact
        if: steps.charm-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm
          path: ${{ inputs.charm_path }}/*.charm
