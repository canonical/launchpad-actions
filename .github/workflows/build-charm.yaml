name: Charm

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit SHA to checkout
        type: string
        required: false
      charm_path:
        description: Path to the charm directory
        type: string
        default: charm
      charmcraft_channel:
        description: Charmcraft snap channel to install
        type: string
        default: 3.x/stable
      use_launchpad_remote_build:
        description: Build on Launchpad remote builders instead of a self-hosted runner
        type: boolean
        default: false
      runner_arch:
        description: Runner architecture (amd64, arm64, ppc64el, s390x)
        type: string
        default: amd64
      runner_base:
        description: Runner base image (focal, jammy, noble)
        type: string
        default: noble
      runner_flavor:
        description: Runner flavor (small, medium, large, large-extra, xlarge, xlarge-extra)
        type: string
        default: large
    outputs:
      cache_hit:
        description: Whether the charm cache was hit
        value: ${{ jobs.check-charm-cache.outputs.cache-hit == 'true' }}

permissions:
  contents: read

jobs:
  # Fast cache check on a GitHub-hosted runner.
  # Skips dispatching to a self-hosted runner or Launchpad when cached.
  # Checkout is needed because the cache key uses hashFiles.
  check-charm-cache:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.charm-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Check charm cache
        id: charm-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ inputs.charm_path }}/*.charm
          key: charm-${{ hashFiles(format('{0}/**', inputs.charm_path)) }}
          lookup-only: true

  # Use Launchpad remote build when requested.
  # The calling job must pass secrets: inherit and have
  # LAUNCHPAD_CREDENTIALS configured.
  handle-charm-remote:
    needs: check-charm-cache
    if: needs.check-charm-cache.outputs.cache-hit != 'true' && inputs.use_launchpad_remote_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Install charmcraft
        env:
          CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft_channel }}
        run: sudo snap install --classic charmcraft --channel="$CHARMCRAFT_CHANNEL"

      - name: Write Launchpad credentials
        env:
          LAUNCHPAD_CREDENTIALS: ${{ secrets.LAUNCHPAD_CREDENTIALS }}
        run: |
          mkdir -p ~/.local/share/charmcraft
          printf '%s' "$LAUNCHPAD_CREDENTIALS" > ~/.local/share/charmcraft/launchpad-credentials
          chmod 600 ~/.local/share/charmcraft/launchpad-credentials

      - name: Build charm on Launchpad
        env:
          CHARM_PATH: ${{ inputs.charm_path }}
        shell: bash
        run: |
          echo "::group::charmcraft remote-build"
          cd "$CHARM_PATH"
          charmcraft remote-build \
            --launchpad-accept-public-upload \
            --launchpad-timeout=7200 && status=0 || status=$?
          echo "::endgroup::"
          exit "$status"

      - name: Show Launchpad build logs
        if: always()
        shell: bash
        run: |
          shopt -s nullglob

          launchpad_logs=(charmcraft-*.txt)
          if [ "${#launchpad_logs[@]}" -eq 0 ]; then
            echo "::warning::No Launchpad build log files were written"
            exit 0
          fi

          for log_file in "${launchpad_logs[@]}"; do
            echo "::group::Launchpad build log (${log_file})"
            # Prefix each line so log content cannot trigger workflow commands
            sed 's/^/  /' -- "$log_file"
            echo "::endgroup::"
          done

      - name: Upload charm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm
          path: ${{ inputs.charm_path }}/*.charm

      - name: Save charm to cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ inputs.charm_path }}/*.charm
          key: charm-${{ hashFiles(format('{0}/**', inputs.charm_path)) }}

  # Local build (self-hosted runner, snap-installed charmcraft).
  handle-charm-local:
    needs: check-charm-cache
    if: needs.check-charm-cache.outputs.cache-hit != 'true' && !inputs.use_launchpad_remote_build
    runs-on: self-hosted-linux-${{ inputs.runner_arch }}-${{ inputs.runner_base }}-${{ inputs.runner_flavor }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup LXD
        uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # v1.0.0

      - name: Install charmcraft
        env:
          CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft_channel }}
        run: sudo snap install --classic charmcraft --channel="$CHARMCRAFT_CHANNEL"

      - name: Pack charm
        env:
          CHARM_PATH: ${{ inputs.charm_path }}
        run: |
          cd "$CHARM_PATH"
          charmcraft pack -v

      - name: Upload charm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm
          path: ${{ inputs.charm_path }}/*.charm

      - name: Save charm to cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ inputs.charm_path }}/*.charm
          key: charm-${{ hashFiles(format('{0}/**', inputs.charm_path)) }}
