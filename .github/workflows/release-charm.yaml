name: Release

on:
  workflow_call:
    inputs:
      charm_cache_hit:
        description: Whether the charm cache was hit
        type: string
        required: true
      commit_sha:
        description: Commit SHA to use for image tag
        type: string
        required: true
      channel:
        description: Charmhub channel
        type: string
        required: true
      charm_name:
        description: Name of the charm to release
        type: string
        required: true
      resource_name:
        description: Name of the resource to release
        type: string
        required: true
      skip_resource_upload:
        description: Skip uploading the OCI image resource (use latest existing revision)
        type: boolean
        default: false
      charmcraft_channel:
        description: Charmcraft snap channel to install
        type: string
        default: 3.x/stable
      runner_arch:
        description: Runner architecture (amd64, arm64, ppc64el, s390x)
        type: string
        default: amd64
      runner_base:
        description: Runner base image (focal, jammy, noble)
        type: string
        default: noble
      runner_flavor:
        description: Runner flavor (small, medium, large, large-extra, xlarge, xlarge-extra)
        type: string
        default: large
    outputs:
      charm_revision:
        description: Charm revision released to Charmhub
        value: ${{ jobs.release.outputs.charm_revision }}
      resource_revision:
        description: Resource revision released to Charmhub
        value: ${{ jobs.release.outputs.resource_revision }}

env:
  IMAGE_URL: ghcr.io/${{ github.repository }}:${{ inputs.commit_sha }}

jobs:
  release:
    outputs:
      charm_revision: ${{ steps.release.outputs.charm_revision }}
      resource_revision: ${{ steps.release.outputs.resource_revision }}
    runs-on: self-hosted-linux-${{ inputs.runner_arch }}-${{ inputs.runner_base }}-${{ inputs.runner_flavor }}
    steps:
      - name: Install charmcraft
        env:
          CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft_channel }}
        run: sudo snap install --classic charmcraft --channel="$CHARMCRAFT_CHANNEL"

      - name: Download charm artifact
        if: inputs.charm_cache_hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charm
          path: artifacts/charm

      - name: Upload charm
        if: inputs.charm_cache_hit != 'true'
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          CHARMHUB_NAME: ${{ inputs.charm_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          charmcraft upload artifacts/charm/*.charm \
            --name "$CHARMHUB_NAME" \
            --release "$CHANNEL"

      - name: Pull GHCR image
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ ! inputs.skip_resource_upload }}

      - name: Upload image as resource
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          CHARMHUB_NAME: ${{ inputs.charm_name }}
          RESOURCE_NAME: ${{ inputs.resource_name }}
          IMAGE_URL: ${{ env.IMAGE_URL }}
        run: |
          charmcraft upload-resource "$CHARMHUB_NAME" "$RESOURCE_NAME" \
            --image "docker://${IMAGE_URL}"
        if: ${{ ! inputs.skip_resource_upload }}

      - name: Release
        id: release
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          CHARMHUB_NAME: ${{ inputs.charm_name }}
          RESOURCE_NAME: ${{ inputs.resource_name }}
          CHANNEL: ${{ inputs.channel }}
          SKIP_RESOURCE_UPLOAD: ${{ inputs.skip_resource_upload }}
        run: |
          set -euo pipefail
          # TODO: REVISION_NUMBER and RESOURCE_REVISION_NUMBER are fetched as the
          # latest revision from Charmhub (awk 'NR==2'). When charm_cache_hit or
          # skip_resource_upload caused the upload steps to be skipped, the "latest"
          # revision may not correspond to the cached artifact being released.
          # A proper fix would capture the revision number from the upload command's
          # stdout and pass it forward as a step output, falling back to the latest
          # only when the upload was skipped.
          REVISION_NUMBER=$( \
            charmcraft revisions "$CHARMHUB_NAME" | \
            awk 'NR==2 {print $1}' \
          )
          RESOURCE_REVISION_NUMBER=$( \
            charmcraft resource-revisions "$CHARMHUB_NAME" "$RESOURCE_NAME" | \
            awk 'NR==2 {print $1}' \
          )
          charmcraft release "$CHARMHUB_NAME" \
            --channel "$CHANNEL" \
            --revision "$REVISION_NUMBER" \
            --resource "${RESOURCE_NAME}:${RESOURCE_REVISION_NUMBER}"

          echo "charm_revision=$REVISION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "resource_revision=$RESOURCE_REVISION_NUMBER" >> "$GITHUB_OUTPUT"

          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "**Charm Revision:** $REVISION_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource Revision:** $RESOURCE_REVISION_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "**Channel:** ${CHANNEL}" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SKIP_RESOURCE_UPLOAD" = "true" ]; then
            echo "**Resource Upload:** Skipped (using existing revision)" >> "$GITHUB_STEP_SUMMARY"
          fi
