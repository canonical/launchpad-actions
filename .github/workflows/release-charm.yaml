name: Release

on:
  workflow_call:
    inputs:
      charm_cache_hit:
        description: Whether the charm cache was hit
        type: string
        required: true
      commit_sha:
        description: Commit SHA to use for image tag
        type: string
        required: true
      channel:
        description: Charmhub channel
        type: string
        required: true
      charm_name:
        description: Name of the charm to release
        type: string
        required: true
      resource_name:
        description: Name of the resource to release
        type: string
        required: true
      charmcraft_channel:
        description: Charmcraft snap channel to install
        type: string
        default: 3.x/stable
    outputs:
      charm_revision:
        description: Charm revision released to Charmhub
        value: ${{ jobs.release.outputs.charm_revision }}
      resource_revision:
        description: Resource revision released to Charmhub
        value: ${{ jobs.release.outputs.resource_revision }}

env:
  CHARMHUB_NAME: ${{ inputs.charm_name }}
  RESOURCE_NAME: ${{ inputs.resource_name }}
  CHANNEL: ${{ inputs.channel }}
  IMAGE_URL: ghcr.io/${{ github.repository }}:${{ inputs.commit_sha }}

jobs:
  release:
    outputs:
      charm_revision: ${{ steps.release.outputs.charm_revision }}
      resource_revision: ${{ steps.release.outputs.resource_revision }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - self-hosted-linux-amd64-noble-large
    steps:
      - name: Install charmcraft
        run: sudo snap install --classic charmcraft --channel=${{ inputs.charmcraft_channel }}

      - name: Download charm artifact
        if: inputs.charm_cache_hit != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: charm
          path: artifacts/charm

      - name: Upload charm
        if: inputs.charm_cache_hit != 'true'
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          charmcraft upload artifacts/charm/*.charm --name "${{ env.CHARMHUB_NAME }}" --release ${{ env.CHANNEL }}

      - name: Pull GHCR image
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload image as resource
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          charmcraft upload-resource "${{ env.CHARMHUB_NAME }}" "${{ env.RESOURCE_NAME }}" \
            --image "docker://${{ env.IMAGE_URL }}"

      - name: Release
        id: release
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          set -euo pipefail
          REVISION_NUMBER=$( \
            charmcraft revisions "${{ env.CHARMHUB_NAME }}" | \
            awk 'NR==2 {print $1}' \
          )
          RESOURCE_REVISION_NUMBER=$( \
            charmcraft resource-revisions "${{ env.CHARMHUB_NAME }}" "${{ env.RESOURCE_NAME }}" | \
            awk 'NR==2 {print $1}' \
          )
          charmcraft release "${{ env.CHARMHUB_NAME }}" \
            --channel ${{ env.CHANNEL }} \
            --revision $REVISION_NUMBER \
            --resource ${{ env.RESOURCE_NAME }}:$RESOURCE_REVISION_NUMBER

          echo "charm_revision=$REVISION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "resource_revision=$RESOURCE_REVISION_NUMBER" >> "$GITHUB_OUTPUT"

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Charm Revision:** $REVISION_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Revision:** $RESOURCE_REVISION_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "**Channel:** ${{ env.CHANNEL }}" >> $GITHUB_STEP_SUMMARY
