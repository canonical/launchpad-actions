name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "actions/terraform-bump-pr/**"
      - ".github/workflows/tests.yaml"
  push:
    branches:
      - main
    paths:
      - "actions/terraform-bump-pr/**"
      - ".github/workflows/tests.yaml"
  workflow_call:

permissions:
  contents: read

jobs:
  unittest:
    name: Python script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Run unit tests
        working-directory: actions/terraform-bump-pr
        run: uv run --locked python -m unittest discover -p 'test_*.py' -v
